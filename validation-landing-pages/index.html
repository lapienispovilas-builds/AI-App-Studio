<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="site-description" name="description" content="Join early access for a simple app designed around a real everyday problem." />
    <title>Early Access</title>
    <script>
      (function () {
        var chapterDomain = window.location.hostname === 'trychapter.lt' || window.location.hostname === 'www.trychapter.lt';
        var chapterRoute = window.location.pathname === '/chapterr-students' || window.location.pathname === '/chapterr-students/';

        var everaDomain = window.location.hostname === 'everahealth.pro' || window.location.hostname === 'www.everahealth.pro';
        var everaRoute = window.location.pathname === '/glp1-tracker-maintenance' || window.location.pathname === '/glp1-tracker-maintenance/';
        var rootRoute = window.location.pathname === '/';
        var showEveraMetadata = everaRoute || (everaDomain && rootRoute);
        var showChapterMetadata = chapterRoute || (chapterDomain && rootRoute);

        if (showEveraMetadata) {
          document.title = 'Evera | Personalized GLP-1 Maintenance Program';
          document.documentElement.lang = 'en';
          document.getElementById('site-description').setAttribute(
            'content',
            'Build a personalized 30-day GLP-1 maintenance plan with Evera.'
          );
        }

        if (!showChapterMetadata) return;

        document.title = 'Chapter';
        document.documentElement.lang = 'lt';
        document.getElementById('site-description').setAttribute(
          'content',
          'Chapter padeda naujiems studentams atrasti panašius žmones ir pradėti naują gyvenimo etapą kartu.'
        );

        var favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/png';
        favicon.href = '/chapterr/chapter-favicon.png';
        document.head.appendChild(favicon);

        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = '/chapterr/chapter-favicon.png';
        document.head.appendChild(appleIcon);
      }());
    </script>
